
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondChance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f4fb;
      color: #302a46;
    }
    nav {
      padding: 25px 8%;
      background: white;
      font-size: 24px;
      font-weight: bold;
      color: #6652a4;
    }
    main {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    h1 { font-size: 54px; margin-bottom: 20px; }
    p {
      font-size: 20px;
      line-height: 1.7;
      max-width: 650px;
      margin: 0 auto 30px;
    }
    button {
      background: #6652a4;
      color: white;
      padding: 16px 36px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>SecondChance</nav>
  <main>
    <section>
      <h1>Give Items a Second Chance</h1>
      <p>
        SecondChance connects people who want to give away
        household items with those who can reuse them.
        Reduce waste, share more, and help the planet.
      </p>
      <button onclick="location.href='/api/secondchance/items'">
        Get Started
      </button>
    </section>
  </main>
</body>
</html>
